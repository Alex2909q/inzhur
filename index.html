<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Inzhur — ідеї щодо покращення сайту та кабінету</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;600;700;800&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #070b16;
    --text: #e2e8f0;
    --muted: #8b98ad;
    --white: #ffffff;
    --line: rgba(255,255,255,.09);
    --glass: rgba(255,255,255,.045);
    --sky: #38bdf8;
    --violet: #a78bfa;
    --problem: #ff7a7a;
    --idea: #34d399;
    --ease: cubic-bezier(.2,.8,.2,1);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: 'Manrope', -apple-system, sans-serif;
    background: var(--bg);
    color: var(--text);
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }
  h1, h2, .display { font-family: 'Unbounded', sans-serif; }

  /* ---------- Background ---------- */
  .bg { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }
  .bg .grid {
    position: absolute; inset: 0;
    background-image:
      linear-gradient(rgba(255,255,255,.035) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,.035) 1px, transparent 1px);
    background-size: 64px 64px;
    mask-image: radial-gradient(ellipse at center, #000 30%, transparent 75%);
    -webkit-mask-image: radial-gradient(ellipse at center, #000 30%, transparent 75%);
  }
  .blob { position: absolute; border-radius: 50%; filter: blur(90px); opacity: .45; animation: drift 22s ease-in-out infinite alternate; }
  .blob.b1 { width: 520px; height: 520px; background: #0ea5e9; top: -160px; left: -120px; }
  .blob.b2 { width: 480px; height: 480px; background: #7c3aed; bottom: -180px; right: -100px; animation-delay: -8s; }
  .blob.b3 { width: 320px; height: 320px; background: #10b981; top: 45%; left: 55%; opacity: .18; animation-delay: -14s; }
  @keyframes drift {
    0%   { transform: translate(0,0) scale(1); }
    50%  { transform: translate(60px,40px) scale(1.08); }
    100% { transform: translate(-40px,70px) scale(.95); }
  }

  /* ---------- Progress ---------- */
  #progress { position: fixed; top: 0; left: 0; height: 3px; width: 0; z-index: 50;
    background: linear-gradient(90deg, var(--sky), var(--violet), var(--idea)); transition: width .4s var(--ease); }

  /* ---------- Slides ---------- */
  #deck { position: fixed; inset: 0; z-index: 1; }
  .slide {
    position: absolute; inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: clamp(16px, 2.5vh, 26px) clamp(18px, 4vw, 54px) clamp(55px, 6.5vh, 70px);
    opacity: 0; visibility: hidden;
    transform: translateX(30px) scale(.99);
    transition: opacity .38s var(--ease), transform .38s var(--ease), visibility .38s;
  }
  .slide.past { transform: translateX(-30px) scale(.99); }
  .slide.active { opacity: 1; visibility: visible; transform: none; }
  .inner {
    width: 100%; max-width: 1560px; max-height: 100%;
    display: flex; flex-direction: column; justify-content: center;
    overflow-y: auto; scrollbar-width: none;
  }
  .inner::-webkit-scrollbar { display: none; }

  .kicker { display: flex; align-items: center; gap: 12px; margin-bottom: clamp(6px, 1.2vh, 10px); }
  .num {
    font-family: 'Unbounded', sans-serif; font-size: .82rem; font-weight: 600;
    color: var(--muted); border: 1px solid var(--line); border-radius: 30px; padding: 5px 12px;
  }
  .tag {
    font-size: .86rem; font-weight: 800; letter-spacing: 1.6px; text-transform: uppercase;
    background: linear-gradient(90deg, var(--sky), var(--violet));
    -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
  }
  h2 {
    font-size: clamp(1.65rem, 2.7vw, 2.6rem); font-weight: 700; line-height: 1.15;
    letter-spacing: -.5px; color: var(--white); max-width: 1200px;
  }

  /* ---------- Screenshot button & preview ---------- */
  .shot-pill {
    display: inline-flex; align-items: center; gap: 6px;
    font-family: 'Manrope', sans-serif; font-size: .82rem; font-weight: 700;
    color: var(--sky); background: rgba(56,189,248,.12);
    border: 1px solid rgba(56,189,248,.35); border-radius: 20px;
    padding: 5px 13px; cursor: pointer; transition: all .2s;
    margin-left: auto;
  }
  .shot-pill:hover {
    background: rgba(56,189,248,.25); border-color: var(--sky);
    transform: translateY(-1px); color: #fff;
  }
  .shot-pill svg { width: 14px; height: 14px; stroke: currentColor; fill: none; stroke-width: 2; }

  .shots-gallery {
    display: grid;
    grid-template-columns: repeat(var(--cols, 1), 1fr);
    gap: clamp(8px, 1.2vw, 14px);
    margin-bottom: clamp(10px, 1.6vh, 16px);
  }
  .shot-preview {
    position: relative;
    border-radius: 14px;
    overflow: hidden;
    border: 1px solid rgba(255,255,255,.16);
    background: rgba(0,0,0,.4);
    cursor: pointer;
    height: clamp(100px, 16vh, 155px);
    display: flex;
    align-items: center;
    justify-content: center;
    transition: border-color .25s, transform .25s, box-shadow .25s;
  }
  .shot-preview:hover {
    border-color: rgba(56,189,248,.65);
    transform: translateY(-2px);
    box-shadow: 0 8px 24px rgba(56,189,248,.18);
  }
  .shot-preview img {
    width: 100%; height: 100%; object-fit: cover; object-position: top center;
    transition: transform .3s var(--ease), filter .3s; filter: brightness(.94);
  }
  .shot-preview:hover img {
    transform: scale(1.03); filter: brightness(1.02);
  }
  .shot-badge {
    position: absolute; bottom: 6px; right: 6px; left: 6px;
    display: flex; align-items: center; justify-content: center; gap: 4px;
    background: rgba(7,11,22,.92); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
    border: 1px solid rgba(255,255,255,.22);
    border-radius: 10px; padding: 3px 6px;
    font-size: clamp(.64rem, .72vw, .74rem); font-weight: 700; color: #e2e8f0; pointer-events: none;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .shot-badge svg { width: 11px; height: 11px; stroke: var(--sky); fill: none; stroke-width: 2; flex-shrink: 0; }

  .lb-nav {
    position: absolute; top: 50%; transform: translateY(-50%);
    width: 46px; height: 46px; border-radius: 50%;
    background: rgba(15,22,40,.88); border: 1px solid rgba(255,255,255,.25);
    color: #fff; font-size: 1.8rem; line-height: 1; display: none;
    place-items: center; cursor: pointer; transition: all .2s; z-index: 10;
    box-shadow: 0 4px 20px rgba(0,0,0,.5);
  }
  .lb-nav:hover { background: var(--sky); color: #070b16; border-color: var(--sky); transform: translateY(-50%) scale(1.1); }
  .lb-prev { left: -26px; }
  .lb-next { right: -26px; }
  .lb-footer { display: flex; align-items: center; gap: 12px; margin-top: 14px; }
  .lb-counter {
    font-family: 'Unbounded', sans-serif; font-size: .78rem; font-weight: 700; color: var(--sky);
    background: rgba(15,22,40,.85); padding: 6px 14px; border-radius: 20px; border: 1px solid var(--line);
  }
  @media (max-width: 900px) {
    .lb-prev { left: 8px; }
    .lb-next { right: 8px; }
  }

  /* ---------- Compare layout ---------- */
  .compare {
    display: grid;
    grid-template-columns: 1fr 54px 1fr;
    gap: clamp(16px, 2vw, 28px);
    align-items: stretch;
    margin-top: clamp(14px, 2vh, 22px);
  }
  .panel {
    position: relative;
    background: var(--glass);
    border: 1px solid var(--line);
    border-radius: 24px;
    min-height: clamp(420px, 58vh, 620px);
    padding: clamp(24px, 3.2vh, 38px) clamp(24px, 2.4vw, 36px);
    backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    display: flex; flex-direction: column; justify-content: flex-start;
  }
  .panel::before { content: ""; position: absolute; top: 0; left: 0; right: 0; height: 3px; }
  .panel.problem::before { background: linear-gradient(90deg, var(--problem), transparent); }
  .panel.idea::before { background: linear-gradient(90deg, var(--idea), transparent); }
  .panel.idea { background: linear-gradient(160deg, rgba(52,211,153,.09), rgba(255,255,255,.035) 55%); border-color: rgba(52,211,153,.22); }
  
  .label {
    display: inline-flex; align-items: center; gap: 8px; margin-bottom: clamp(8px, 1.3vh, 14px);
    font-size: .82rem; font-weight: 800; letter-spacing: 1.6px; text-transform: uppercase;
  }
  .label::before { content: ""; width: 9px; height: 9px; border-radius: 50%; }
  .problem .label { color: var(--problem); } .problem .label::before { background: var(--problem); box-shadow: 0 0 12px var(--problem); }
  .idea .label { color: var(--idea); } .idea .label::before { background: var(--idea); box-shadow: 0 0 12px var(--idea); }

  .panel ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; justify-content: space-evenly; flex: 1; }
  .panel li {
    display: grid; grid-template-columns: 28px 1fr; gap: 14px; align-items: start;
    font-size: clamp(1.04rem, 1.25vw, 1.28rem); line-height: 1.48; color: #c4cede;
    margin-bottom: clamp(8px, 1.4vh, 16px);
  }
  .panel li:last-child { margin-bottom: 0; }
  .panel li strong { color: var(--white); font-weight: 700; }
  .mark {
    width: 24px; height: 24px; border-radius: 7px; display: grid; place-items: center;
    font-size: .8rem; font-weight: 800; margin-top: 1px; flex-shrink: 0;
  }
  .problem .mark { background: rgba(255,122,122,.13); color: var(--problem); }
  .idea .mark { background: rgba(52,211,153,.14); color: var(--idea); }

  .arrow {
    align-self: center; width: 50px; height: 50px; border-radius: 50%;
    display: grid; place-items: center; font-size: 1.35rem; color: var(--white);
    background: linear-gradient(135deg, rgba(56,189,248,.25), rgba(167,139,250,.25));
    border: 1px solid var(--line); flex-shrink: 0;
  }

  .chips { display: flex; flex-wrap: wrap; gap: 7px; margin: 0 0 clamp(8px, 1.3vh, 14px); }
  .chip {
    font-size: .84rem; font-weight: 600; color: #aab6c8;
    border: 1px dashed rgba(255,255,255,.2); border-radius: 8px; padding: 4px 10px;
  }

  /* ---------- Automatic Staggered Animations ---------- */
  .slide .kicker,
  .slide h2,
  .slide .panel,
  .slide .arrow,
  .cover .eyebrow,
  .cover h1,
  .cover .sub,
  .cover .start-hint {
    opacity: 0;
    transform: translateY(12px);
    transition: opacity .42s var(--ease), transform .42s var(--ease);
  }
  .slide.active .kicker { opacity: 1; transform: none; transition-delay: .05s; }
  .slide.active h2 { opacity: 1; transform: none; transition-delay: .1s; }
  .slide.active .panel.problem { opacity: 1; transform: none; transition-delay: .15s; }
  .slide.active .arrow { opacity: 1; transform: none; transition-delay: .3s; }
  .slide.active .panel.idea { opacity: 1; transform: none; transition-delay: .35s; }
  .slide.active.cover .eyebrow, .slide.active .eyebrow { opacity: 1; transform: none; transition-delay: .05s; }
  .slide.active.cover h1, .slide.active h1 { opacity: 1; transform: none; transition-delay: .12s; }
  .slide.active.cover .sub, .slide.active .sub { opacity: 1; transform: none; transition-delay: .22s; }
  .slide.active.cover .start-hint, .slide.active .start-hint { opacity: 1; transform: none; transition-delay: .32s; }

  /* Fragments (List items auto-revealed with delay) */
  .frag {
    opacity: 0;
    transform: translateY(8px);
    filter: blur(2px);
    transition: opacity .38s var(--ease), transform .38s var(--ease), filter .38s var(--ease);
    transition-delay: var(--delay, 0s);
  }
  .slide.active .frag {
    opacity: 1;
    transform: none;
    filter: none;
  }

  /* ---------- Cover / Closing ---------- */
  .cover .inner { max-width: 1300px; }
  .eyebrow {
    display: inline-flex; align-items: center; gap: 10px; padding: 8px 18px; border-radius: 30px;
    border: 1px solid var(--line); background: var(--glass); font-weight: 700; font-size: .95rem; color: #cbd5e1; margin-bottom: 24px;
  }
  .eyebrow .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--idea); box-shadow: 0 0 12px var(--idea); animation: pulse 2s infinite; }
  @keyframes pulse { 50% { opacity: .35; } }
  h1 {
    font-size: clamp(2.8rem, 5.8vw, 5.2rem); font-weight: 800; line-height: 1.05; letter-spacing: -2px; color: var(--white);
  }
  h1 .grad {
    background: linear-gradient(90deg, var(--sky), var(--violet) 55%, var(--idea));
    -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
  }
  .sub { margin-top: 24px; font-size: clamp(1.15rem, 1.6vw, 1.45rem); color: var(--muted); max-width: 900px; line-height: 1.6; }
  .start-hint { margin-top: 40px; display: flex; align-items: center; gap: 12px; color: var(--muted); font-weight: 600; font-size: 1rem; }
  kbd {
    font-family: 'Manrope', sans-serif; font-weight: 800; font-size: .8rem; color: var(--white);
    min-width: 28px; height: 28px; padding: 0 8px; border-radius: 7px; display: inline-grid; place-items: center;
    background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.16); border-bottom-width: 3px;
  }
  .start-hint kbd { animation: nudge 1.6s ease-in-out infinite; }
  @keyframes nudge { 50% { transform: translateX(4px); } }

  /* ---------- Bottom bar ---------- */
  #bar {
    position: fixed; left: 50%; bottom: 16px; transform: translateX(-50%); z-index: 40;
    display: flex; align-items: center; gap: 5px; padding: 6px;
    background: rgba(15,22,40,.75); border: 1px solid var(--line); border-radius: 15px;
    backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
    box-shadow: 0 10px 36px rgba(0,0,0,.35);
  }
  #bar button {
    height: 36px; min-width: 36px; padding: 0 11px; border-radius: 10px; border: none; cursor: pointer;
    background: transparent; color: #cbd5e1; font: 700 .84rem 'Manrope', sans-serif;
    display: inline-flex; align-items: center; justify-content: center; gap: 6px; transition: background .2s, color .2s;
  }
  #bar button:hover { background: rgba(255,255,255,.09); color: #fff; }
  #bar button:disabled { opacity: .3; cursor: default; background: transparent; }
  #bar button.on { color: var(--idea); }
  #bar .sep { width: 1px; height: 20px; background: var(--line); margin: 0 3px; }
  #counter { font-family: 'Unbounded', sans-serif; font-size: .76rem; color: #cbd5e1; padding: 0 8px; min-width: 68px; text-align: center; }
  #timer { font-variant-numeric: tabular-nums; }
  #bar svg { width: 17px; height: 17px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

  /* ---------- Side dots ---------- */
  #dots { position: fixed; right: 18px; top: 50%; transform: translateY(-50%); z-index: 40; display: flex; flex-direction: column; gap: 8px; }
  #dots button {
    width: 7px; height: 7px; border-radius: 7px; border: none; cursor: pointer; padding: 0;
    background: rgba(255,255,255,.22); transition: height .3s var(--ease), background .3s; position: relative;
  }
  #dots button.active { height: 24px; background: linear-gradient(var(--sky), var(--violet)); }
  #dots button:hover::after {
    content: attr(data-title); position: absolute; right: 16px; top: 50%; transform: translateY(-50%);
    white-space: nowrap; font: 600 .78rem 'Manrope', sans-serif; color: #fff;
    background: rgba(15,22,40,.92); border: 1px solid var(--line); padding: 5px 9px; border-radius: 7px;
  }

  /* ---------- Lightbox Modal ---------- */
  .lightbox {
    position: fixed; inset: 0; z-index: 100;
    background: rgba(4, 7, 16, .92);
    backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
    display: none; align-items: center; justify-content: center;
    padding: 24px;
  }
  .lightbox.open { display: flex; animation: fadeIn .2s var(--ease); }
  .lb-content {
    position: relative; max-width: 92vw; max-height: 90vh;
    display: flex; flex-direction: column; align-items: center;
  }
  .lb-content img {
    max-width: 100%; max-height: 82vh; border-radius: 14px;
    border: 1px solid rgba(255,255,255,.18);
    box-shadow: 0 20px 60px rgba(0,0,0,.65);
    object-fit: contain;
  }
  .lb-caption {
    margin-top: 12px; font-size: .88rem; font-weight: 600; color: #cbd5e1;
    background: rgba(15,22,40,.8); padding: 6px 14px; border-radius: 20px; border: 1px solid var(--line);
  }
  .lb-close {
    position: absolute; top: -14px; right: -14px; width: 34px; height: 34px;
    border-radius: 50%; border: 1px solid var(--line); background: #1e293b; color: #fff;
    cursor: pointer; display: grid; place-items: center; font-weight: 800; font-size: .9rem;
    box-shadow: 0 4px 16px rgba(0,0,0,.4); transition: transform .2s, background .2s;
  }
  .lb-close:hover { transform: scale(1.1); background: var(--problem); }

  /* ---------- Overlays ---------- */
  .overlay {
    position: fixed; inset: 0; z-index: 60; display: none; overflow-y: auto;
    background: rgba(7,11,22,.9); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    padding: 50px 6vw;
  }
  .overlay.open { display: block; animation: fadeIn .25s var(--ease); }
  @keyframes fadeIn { from { opacity: 0; } }
  .overlay h3 { font-family: 'Unbounded', sans-serif; font-size: 1.3rem; color: #fff; margin-bottom: 22px; display: flex; justify-content: space-between; align-items: center; }
  .overlay h3 span { font-family: 'Manrope', sans-serif; font-size: .82rem; color: var(--muted); font-weight: 600; }
  .ov-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 12px; }
  .ov-card {
    text-align: left; font: inherit; color: inherit; cursor: pointer; aspect-ratio: 16/10;
    display: flex; flex-direction: column; justify-content: space-between;
    background: var(--glass); border: 1px solid var(--line); border-radius: 14px; padding: 14px;
    transition: transform .2s var(--ease), border-color .2s;
  }
  .ov-card:hover { transform: translateY(-3px); border-color: rgba(56,189,248,.5); }
  .ov-card.active { border-color: var(--idea); box-shadow: 0 0 0 1px var(--idea) inset; }
  .ov-card .o-num { font-family: 'Unbounded', sans-serif; font-size: .7rem; color: var(--sky); }
  .ov-card .o-tag { font-size: .68rem; font-weight: 800; letter-spacing: 1.2px; text-transform: uppercase; color: var(--muted); margin-top: 4px; }
  .ov-card .o-title { font-weight: 800; color: #fff; font-size: .92rem; line-height: 1.28; }

  .help-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 10px; max-width: 860px; }
  .help-list div { display: flex; align-items: center; gap: 10px; color: #cbd5e1; font-weight: 600; font-size: .88rem; background: var(--glass); border: 1px solid var(--line); border-radius: 11px; padding: 10px 12px; }
  .help-list kbd { flex-shrink: 0; }

  /* ---------- Responsive & Screen Fit ---------- */
  @media (max-height: 820px) {
    .inner { max-width: 1440px; }
    .slide { padding: 12px 3.5vw 56px; }
    h2 { font-size: clamp(1.4rem, 2.3vw, 2.1rem); }
    .kicker { margin-bottom: 4px; }
    .compare { margin-top: 10px; gap: 14px; }
    .panel { min-height: clamp(360px, 50vh, 480px); padding: 16px 20px 14px; border-radius: 18px; }
    .panel li { font-size: 0.98rem; line-height: 1.38; margin-bottom: 6px; }
    .chips { margin-bottom: 8px; gap: 5px; }
    .chip { font-size: 0.78rem; padding: 3px 8px; }
    .label { margin-bottom: 8px; }
    .arrow { width: 42px; height: 42px; font-size: 1.15rem; }
    .shot-preview { height: 75px; margin-bottom: 8px; }
  }
  @media (max-height: 680px) {
    .slide { padding: 8px 3vw 50px; }
    h2 { font-size: 1.35rem; }
    .panel { padding: 10px 16px 8px; }
    .panel li { font-size: 0.86rem; line-height: 1.3; margin-bottom: 4px; }
    .kicker { margin-bottom: 2px; }
    .shot-preview { height: 55px; }
  }
  @media (max-width: 900px) {
    .compare { grid-template-columns: 1fr; }
    .arrow { transform: rotate(90deg); justify-self: center; }
    .slide { padding: 40px 5vw 80px; align-items: flex-start; }
    #dots, .hide-sm { display: none !important; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>

<div class="bg"><div class="grid"></div><div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div></div>
<div id="progress"></div>
<main id="deck"></main>
<nav id="dots"></nav>

<div id="bar">
  <button id="prev" title="Назад (←)"><svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg></button>
  <span id="counter">1 / 1</span>
  <button id="next" title="Далі (→ або пробіл)"><svg viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"/></svg></button>
  <span class="sep"></span>
  <button id="autoBtn" class="hide-sm" title="Автоперемикання слайдів (A)">

    "title": "Дякую за увагу!"
  }
];

/* ================= BUILD ================= */
const deck = document.getElementById('deck');
const total = SLIDES.length;
const pad = n => String(n).padStart(2, '0');

function listHTML(items, kind, baseDelay) {
  const mark = kind === 'problem' ? '✕' : '✓';
  return '<ul>' + items.map((t, idx) => {
    const d = (baseDelay + idx * 0.08).toFixed(2);
    return `<li class="frag" data-kind="${kind}" style="--delay: ${d}s"><span class="mark">${mark}</span><span>${t}</span></li>`;
  }).join('') + '</ul>';
}

SLIDES.forEach((s, i) => {
  const el = document.createElement('section');
  el.className = 'slide';
  let html = '';

  if (s.type === 'cover') {
    el.classList.add('cover');
    html = `
      <div class="eyebrow"><span class="dot"></span>Inzhur · продуктовий аналіз</div>
      <h1>Ідеї щодо покращення<br><span class="grad">сайту та кабінету</span></h1>
      <p class="sub">Спостереження з досвіду користувача та пропозиції, як зробити шлях від першого відвідування до інвестиції простішим і зрозумілішим.</p>
      <div class="start-hint"><kbd>→</kbd> або <kbd>Пробіл</kbd> щоб почати · <kbd>O</kbd> огляд слайдів</div>`;
  } else if (s.type === 'closing') {
    el.classList.add('cover');
    html = `
      <div class="eyebrow"><span class="dot"></span>Inzhur · підсумок</div>
      <h1>Дякую за увагу!<br><span class="grad">Обговорення та запитання</span></h1>
      <p class="sub">Готовий відповісти на запитання, детальніше розібрати будь-який слайд та обговорити пріоритети впровадження ідей.</p>
      <div class="start-hint"><kbd>O</kbd> огляд усіх слайдів · <kbd>Home</kbd> на перший слайд · <kbd>←</kbd> повернутися назад</div>`;
  } else {
    const chips = s.chips ? `<div class="chips">${s.chips.map(c => `<span class="chip">${c}</span>`).join('')}</div>` : '';
    
    let shotHTML = '';
    let pillHTML = '';
    const imgList = s.images || (s.image ? [{ url: s.image, label: s.imageLabel || 'Скріншот', caption: s.imageCaption || s.imageLabel, pos: s.imagePos || 'center' }] : []);
    
    if (imgList.length > 0) {
      const pillText = imgList.length > 1 ? `📷 ${imgList.length} скріншоти` : '📷 Скріншот';
      pillHTML = `
        <button class="shot-pill" onclick="openGallery(${i}, 0)" title="Відкрити скріншоти">
          <svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>
          ${pillText}
        </button>`;

      const previews = imgList.map((img, idx) => `
        <div class="shot-preview" onclick="openGallery(${i}, ${idx})" title="Натисніть для збільшення">
          <img src="${img.url}" alt="${img.label}" loading="lazy" style="object-position: ${img.pos || 'center'};">
          <span class="shot-badge">
            <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
            ${img.label}
          </span>
        </div>`).join('');

      shotHTML = `<div class="shots-gallery" style="--cols: ${imgList.length}">${previews}</div>`;
    }

    html = `
      <div class="kicker">
        <span class="num">${pad(i + 1)} / ${pad(total)}</span>
        <span class="tag">${s.tag}</span>
        ${pillHTML}
      </div>
      <h2>${s.title}</h2>
      <div class="compare">
        <div class="panel problem">
          <div class="label">Як зараз</div>
          ${shotHTML}
          ${chips}
          ${listHTML(s.problem, 'problem', 0.20)}
        </div>
        <div class="arrow">→</div>
        <div class="panel idea">
          <div class="label">${s.ideaLabel || 'Ідея'}</div>
          ${listHTML(s.idea, 'idea', 0.45)}
        </div>
      </div>`;
  }
  el.innerHTML = `<div class="inner">${html}</div>`;
  deck.appendChild(el);
});

const slideEls = [...document.querySelectorAll('.slide')];

/* dots + overview */
const dots = document.getElementById('dots');
const ovGrid = document.getElementById('ovGrid');
SLIDES.forEach((s, i) => {
  const d = document.createElement('button');
  d.dataset.title = `${pad(i + 1)} · ${s.title}`;
  d.onclick = () => goTo(i);
  dots.appendChild(d);

  const c = document.createElement('button');
  c.className = 'ov-card';
  c.innerHTML = `<div><div class="o-num">${pad(i + 1)}</div><div class="o-tag">${s.tag}</div></div><div class="o-title">${s.title}</div>`;
  c.onclick = () => { goTo(i); closeOverlays(); };
  ovGrid.appendChild(c);
});

/* ================= LIGHTBOX & GALLERY ================= */
const lightbox = document.getElementById('lightbox');
const lbImg = document.getElementById('lbImg');
const lbCaption = document.getElementById('lbCaption');
const lbCounter = document.getElementById('lbCounter');
const lbPrev = document.getElementById('lbPrev');
const lbNext = document.getElementById('lbNext');

let currentGallery = [];
let currentGalleryIdx = 0;

function openGallery(slideIdx, imgIdx) {
  const s = SLIDES[slideIdx];
  const list = s.images || (s.image ? [{ url: s.image, label: s.imageLabel || 'Скріншот', caption: s.imageCaption || s.imageLabel }] : []);
  if (!list.length) return;
  currentGallery = list;
  currentGalleryIdx = imgIdx || 0;
  updateLightboxView();
  lightbox.classList.add('open');
}

function updateLightboxView() {
  const item = currentGallery[currentGalleryIdx];
  if (!item) return;
  lbImg.src = item.url;
  lbCaption.textContent = item.caption || item.label || 'Скріншот';
  if (currentGallery.length > 1) {
    lbCounter.textContent = `${currentGalleryIdx + 1} / ${currentGallery.length}`;
    lbCounter.style.display = 'inline-block';
    lbPrev.style.display = 'grid';
    lbNext.style.display = 'grid';
  } else {
    lbCounter.style.display = 'none';
    lbPrev.style.display = 'none';
    lbNext.style.display = 'none';
  }
}

function lbNav(dir) {
  if (currentGallery.length <= 1) return;
  currentGalleryIdx = (currentGalleryIdx + dir + currentGallery.length) % currentGallery.length;
  updateLightboxView();
}

function closeLightbox(e) {
  if (e && e.target !== lightbox && !e.target.classList.contains('lb-close')) return;
  lightbox.classList.remove('open');
  lbImg.src = '';
  currentGallery = [];
}

/* ================= STATE & NAVIGATION ================= */
let cur = 0;

function render() {
  slideEls.forEach((el, k) => {
    el.classList.toggle('active', k === cur);
    el.classList.toggle('past', k < cur);
  });
  document.getElementById('counter').textContent = `${pad(cur + 1)} / ${pad(total)}`;
  document.getElementById('prev').disabled = cur === 0;
  document.getElementById('next').disabled = cur === total - 1;
  document.getElementById('progress').style.width = (cur / (total - 1) * 100) + '%';
  [...dots.children].forEach((d, k) => d.classList.toggle('active', k === cur));
  [...ovGrid.children].forEach((c, k) => c.classList.toggle('active', k === cur));
  history.replaceState(null, '', '#' + (cur + 1));
}

function goTo(i) {
  if (i < 0 || i >= total) return;
  cur = i;
  closeLightbox();
  startTimer();
  render();
  if (autoPlay) restartAutoTimer();
}

function next() {
  if (cur < total - 1) goTo(cur + 1);
}
function prev() {
  if (cur > 0) goTo(cur - 1);
}

/* autoplay slideshow */
let autoPlay = false;
let autoTimer = null;
const autoBtn = document.getElementById('autoBtn');
function toggleAuto() {
  autoPlay = !autoPlay;
  autoBtn.classList.toggle('on', autoPlay);
  document.getElementById('autoLabel').textContent = autoPlay ? 'Стоп' : 'Автоплей';
  if (autoPlay) {
    restartAutoTimer();
  } else {
    clearTimeout(autoTimer);
  }
}
function restartAutoTimer() {
  clearTimeout(autoTimer);
  if (!autoPlay) return;
  autoTimer = setTimeout(() => {
    if (!autoPlay) return;
    if (cur < total - 1) {
      next();
    } else {
      toggleAuto();
    }
  }, 8000);
}

/* overlays */
const overview = document.getElementById('overview');
const help = document.getElementById('help');
function closeOverlays() { overview.classList.remove('open'); help.classList.remove('open'); }
function toggleOverlay(el) { const open = el.classList.contains('open'); closeOverlays(); if (!open) el.classList.add('open'); }

/* fullscreen */
function toggleFS() {
  document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen().catch(() => {});
}

/* timer */
let t0 = null, tInt = null;
const timerEl = document.getElementById('timer');
function startTimer() {
  if (t0) return;
  t0 = Date.now();
  tInt = setInterval(() => {
    const s = Math.floor((Date.now() - t0) / 1000);
    timerEl.textContent = pad(Math.floor(s / 60)) + ':' + pad(s % 60);
  }, 1000);
}
function resetTimer() { clearInterval(tInt); t0 = null; timerEl.textContent = '00:00'; }

/* ================= EVENTS ================= */
document.getElementById('next').onclick = next;
document.getElementById('prev').onclick = prev;
autoBtn.onclick = toggleAuto;
document.getElementById('ovBtn').onclick = () => toggleOverlay(overview);
document.getElementById('helpBtn').onclick = () => toggleOverlay(help);
document.getElementById('fsBtn').onclick = toggleFS;
timerEl.onclick = resetTimer;
overview.onclick = e => { if (e.target === overview) closeOverlays(); };
help.onclick = closeOverlays;

deck.addEventListener('click', e => {
  if (e.target.closest('.shot-preview') || e.target.closest('.shot-pill') || e.target.closest('button')) return;
  if (window.getSelection().toString()) return;
  e.clientX < window.innerWidth * 0.3 ? prev() : next();
});

document.addEventListener('keydown', e => {
  const k = e.key;
  if (lightbox.classList.contains('open')) {
    if (k === 'Escape') { closeLightbox(); }
    else if (k === 'ArrowLeft' || k === 'ArrowUp') { lbNav(-1); }
    else if (k === 'ArrowRight' || k === 'ArrowDown' || k === ' ') { lbNav(1); }
    return;
  }
  const anyOpen = overview.classList.contains('open') || help.classList.contains('open');
  if (k === 'Escape') { closeOverlays(); return; }
  if (k === 'o' || k === 'O' || k === 'щ' || k === 'Щ') { toggleOverlay(overview); return; }
  if (k === '?' || k === 'h' || k === 'H' || k === 'р' || k === 'Р') { toggleOverlay(help); return; }
  if (anyOpen) return;
  if (['ArrowRight', 'ArrowDown', ' ', 'PageDown', 'Enter'].includes(k)) { e.preventDefault(); next(); }
  else if (['ArrowLeft', 'ArrowUp', 'PageUp', 'Backspace'].includes(k)) { e.preventDefault(); prev(); }
  else if (k === 'Home') goTo(0);
  else if (k === 'End') goTo(total - 1);
  else if (k === 'f' || k === 'F' || k === 'а' || k === 'А') toggleFS();
  else if (k === 'a' || k === 'A' || k === 'ф' || k === 'Ф') toggleAuto();
  else if (k === 't' || k === 'T' || k === 'е' || k === 'Е') resetTimer();
});

let tx = null;
document.addEventListener('touchstart', e => { tx = e.touches[0].clientX; }, { passive: true });
document.addEventListener('touchend', e => {
  if (tx === null) return;
  const dx = e.changedTouches[0].clientX - tx;
  if (lightbox.classList.contains('open')) {
    if (Math.abs(dx) > 40) dx < 0 ? lbNav(1) : lbNav(-1);
    tx = null;
    return;
  }
  if (Math.abs(dx) > 50) dx < 0 ? next() : prev();
  tx = null;
});

/* init */
const fromHash = parseInt(location.hash.slice(1), 10);
goTo(!isNaN(fromHash) ? Math.min(Math.max(fromHash - 1, 0), total - 1) : 0);
resetTimer();
</script>
</body>
</html>
